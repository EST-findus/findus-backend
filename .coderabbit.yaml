# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: >-
  모든 설명은 한국어로 작성하세요. 비개발자도 이해하도록 변경 목적과 사용자 영향을 먼저 설명하고,
  전문 용어는 짧게 풀어 쓰세요. 리뷰 지적은 문제 상황, 영향, 개선 방법 순서로 설명하세요.
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    한국어로 목적, 주요 변화, 검증 결과를 3~5개 항목으로 짧게 요약하세요.
    비개발 팀원도 서비스에 어떤 영향이 있는지 알 수 있게 쓰고 확인되지 않은 테스트 결과를 단정하지 마세요.
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "^dev$"
      - "^main$"
  path_filters:
    - "!build/**"
    - "!.gradle/**"
    - "!gradle/wrapper/gradle-wrapper.jar"
  path_instructions:
    - path: "**"
      instructions: >-
        모든 리뷰를 한국어로 작성하세요. FindUs는 실종아동 정보를 다루므로 사진, 연락처, 개인정보,
        비밀번호와 토큰 노출을 우선 점검하세요. 변경 목적과 서비스 영향을 먼저 설명하고 세부 지적은
        실제 발생 조건, 중요도와 해결 방향을 제시하세요. 정해지지 않은 스타일 규칙을 강요하지 말고
        기존 코드의 일관성을 따르세요. 작은 취향 차이보다 오류, 보안, 데이터 손실을 우선하세요.
    - path: "src/main/java/**"
      instructions: >-
        인증과 권한 우회, 입력 검증, 트랜잭션 경계, JPA 쿼리와 N+1, 동시 요청의 데이터 무결성,
        예외 응답과 민감값 로그를 검토하세요. AI 예상 얼굴을 신원 확인 결과로 단정하는 로직도 확인하세요.
    - path: "src/main/resources/db/migration/**"
      instructions: >-
        PostgreSQL 호환성, 이미 적용한 마이그레이션 수정, 컬럼 삭제와 데이터 손실, 유니크 제약과
        인덱스 누락을 확인하세요. 변경 위험과 기존 데이터에 미치는 영향을 쉬운 말로 설명하세요.
    - path: "src/main/resources/**"
      instructions: >-
        프로필 분리, 비밀값 하드코딩, 환경변수 누락, JPA 자동 스키마 변경,
        Flyway와 초기화 SQL 충돌, 연결 타임아웃을 확인하세요.
    - path: "docker-compose.yml"
      instructions: >-
        이미지 버전 고정, 로컬 포트 노출 범위, 인증, healthcheck, 데이터 볼륨과 재시작 시 데이터 유지,
        환경변수 전달을 점검하세요. 로컬 개발 설정을 운영용 보안 구성으로 오해하지 않도록 확인하세요.
    - path: "build.gradle"
      instructions: >-
        Java 17과 Spring Boot 호환성, BOM 버전 관리, PostgreSQL용 Flyway 모듈,
        테스트 라이브러리의 실행 범위를 확인하세요. 필요 없는 라이브러리 추가를 지적하세요.
    - path: "src/test/**"
      instructions: >-
        테스트가 실제 실패 상황과 연결 동작을 검증하는지, 로컬 개발 DB를 변경하지 않는지,
        테스트 데이터와 컨테이너가 정리되는지 확인하세요. 구현을 그대로 복사한 무의미한 테스트는 피하세요.
    - path: "README.md"
      instructions: >-
        비개발자가 이해할 수 있는지, Mac과 Windows 명령이 명확히 분리되어 있는지,
        실제 구현 상태와 실행 안내가 일치하는지 확인하세요. 반복 설명으로 문서를 늘리지 마세요.
chat:
  auto_reply: true
