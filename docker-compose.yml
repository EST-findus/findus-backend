name: findus-local

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findus}
      POSTGRES_USER: ${POSTGRES_USER:-findus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 입력하세요}
      PGPORT: ${POSTGRES_PORT:-15432}
    # 내 컴퓨터와 컨테이너에서 같은 포트를 사용합니다.
    command: ["postgres", "-p", "${POSTGRES_PORT:-15432}"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:${POSTGRES_PORT:-15432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p \"$$PGPORT\" -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    environment:
      REDIS_PORT: ${REDIS_PORT:-16379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 입력하세요}
    # 비밀번호는 컨테이너 안에서 환경변수로 읽습니다. 공유 파일에 실제 값을 넣지 않습니다.
    command: ["sh", "-c", 'exec redis-server --port "$$REDIS_PORT" --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:${REDIS_PORT:-16379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli -p "$$REDIS_PORT" ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    group_add: ["0"]
    environment:
      DATA_SOURCE_URI: "postgres:${POSTGRES_PORT:-15432}/${POSTGRES_DB:-findus}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-findus}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
      PG_EXPORTER_COLLECTION_TIMEOUT: 4s
    # 수집 포트는 내부 네트워크에서만 사용합니다. PC에 공개하지 않습니다.
    command: ["--web.listen-address=:19187"]
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0-alpine
    group_add: ["0"]
    environment:
      REDIS_ADDR: "redis://redis:${REDIS_PORT:-16379}"
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: ":19121"
      REDIS_EXPORTER_INCLUDE_METRICS_FOR_EMPTY_DATABASES: "true"
    # 시작할 때 secrets 파일에서 비밀번호를 읽고 실제 값을 공유 설정에 적지 않습니다.
    entrypoint: ["/bin/sh", "-c"]
    command: ['export REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"; exec /redis_exporter']
    secrets:
      - redis_password
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    # 일반 사용자 실행을 유지하면서 root 그룹 소유의 secrets 파일을 읽게 합니다.
    group_add: ["0"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=:19090
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:19090:19090"
    # 컨테이너에서 Mac·Windows의 Spring 서버로 접속할 때 사용합니다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - prometheus_password
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:19090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SERVER_HTTP_PORT: "13000"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:13000:13000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

# .env의 비밀번호를 읽고, 필요한 컨테이너에만 읽기 전용 파일로 전달합니다.
secrets:
  prometheus_password:
    environment: PROMETHEUS_PASSWORD
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
  postgres_password:
    environment: POSTGRES_PASSWORD
  redis_password:
    environment: REDIS_PASSWORD

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
