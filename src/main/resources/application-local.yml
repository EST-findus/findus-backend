# 백엔드 폴더 또는 상위 FindUs 폴더에서 실행할 때 로컬 .env를 읽습니다.
# 두 파일이 모두 있으면 현재 작업 폴더의 .env가 우선합니다.
# 실제 비밀번호는 Git에서 제외된 .env에만 작성하세요.
spring:
  config:
    import:
      - "optional:file:./findus-backend/.env[.properties]"
      - "optional:file:./.env[.properties]"

# 로컬 HTTP 개발에서만 Secure 쿠키를 해제합니다. 배포 시에는 HTTPS를 사용합니다.
app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  monitoring:
    enabled: true
    password: ${PROMETHEUS_PASSWORD}

# API 포트와 메트릭 포트를 구분합니다. Prometheus가 이 포트에 인증 후 접속합니다.
management:
  server:
    port: 19081
  endpoints:
    web:
      exposure:
        include: prometheus
      discovery:
        enabled: false
  endpoint:
    prometheus:
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: findus-backend
    distribution:
      # 요청 시간 분포를 수집하여 Grafana에서 느린 요청의 기준인 p95를 계산합니다.
      percentiles-histogram:
        http.server.requests: true
