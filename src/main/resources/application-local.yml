# 백엔드 폴더 또는 상위 FindUs 폴더에서 실행할 때 로컬 .env를 읽습니다.
# 두 파일이 모두 있으면 현재 작업 폴더의 .env가 우선합니다.
# 실제 비밀번호는 Git에서 제외된 .env에만 작성하세요.
# FINDUS_ENV_FILE로 읽을 파일을 바꿉니다. 예: FINDUS_ENV_FILE=.env.deploy
spring:
  config:
    import:
      - "optional:file:./findus-backend/${FINDUS_ENV_FILE:.env}[.properties]"
      - "optional:file:./${FINDUS_ENV_FILE:.env}[.properties]"
  # AI 작업 저장 API가 받는 결과 사진(최대 10MB)과 연결 정보를 함께 받을 수 있게 합니다.
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

# 로컬 HTTP 개발에서만 Secure 쿠키를 해제합니다. 배포 시에는 HTTPS를 사용합니다.
app:
  # 시작 시 갱신할 데이터와 직접 요청해 유지할 데이터를 구분합니다.
  dummy:
    enabled: ${DUMMY_DATA_ENABLED:true}
    startup-enabled: ${DUMMY_STARTUP_ENABLED:true}
    password: ${DUMMY_PASSWORD:Dummy-test123!}
  # 로컬 Compose의 모니터링 서비스까지 헬스체크합니다.
  health:
    monitoring:
      enabled: true
      prometheus-url: ${PROMETHEUS_URL:http://localhost:19090}
      grafana-url: ${GRAFANA_URL:http://localhost:13000}
  # Python AI 작업 화면의 저장 API. 이 PC의 서버 간 요청만 받으며 명시적으로 켰을 때만 등록합니다.
  aiworkbench:
    enabled: ${AI_WORKBENCH_ENABLED:false}
  # 대표 원본 사진 수작업 지정 화면(/test/main-photo). 이 PC의 localhost 접속만 받으며 명시적으로 켰을 때만 등록합니다.
  main-photo-tool:
    enabled: ${MAIN_PHOTO_TOOL_ENABLED:false}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  monitoring:
    enabled: true
    password: ${PROMETHEUS_PASSWORD}

# API 포트와 메트릭 포트를 구분합니다. Prometheus가 이 포트에 인증 후 접속합니다.
management:
  server:
    port: 19081
  endpoints:
    web:
      exposure:
        include: prometheus
      discovery:
        enabled: false
  endpoint:
    prometheus:
      access: read-only
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: findus-backend
    distribution:
      # 요청 시간 분포를 수집하여 Grafana에서 느린 요청의 기준인 p95를 계산합니다.
      percentiles-histogram:
        http.server.requests: true

# Swagger는 API 서버와 같은 포트에서 사용하며, 기존 인증 규칙을 유지합니다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    persist-authorization: false
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN
