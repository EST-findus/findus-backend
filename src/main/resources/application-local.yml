# 백엔드 폴더 또는 상위 FindUs 폴더에서 실행할 때 로컬 .env를 읽습니다.
# 두 파일이 모두 있으면 현재 작업 폴더의 .env가 우선합니다.
# 실제 비밀번호는 Git에서 제외된 .env에만 작성하세요.
spring:
  config:
    import:
      - "optional:file:./findus-backend/.env[.properties]"
      - "optional:file:./.env[.properties]"

# 로컬 HTTP 개발에서만 Secure 쿠키를 해제합니다. 배포 시에는 HTTPS를 사용합니다.
app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
