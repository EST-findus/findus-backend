spring:
  application:
    name: FindUs
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:findus}
    username: ${POSTGRES_USER:findus}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: findus
  flyway:
    enabled: true
    default-schema: public
    clean-disabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  data:
    # 게시글 목록은 기본 10개, 최대 100개까지 조회합니다.
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 3s
      timeout: 3s

server:
  port: ${SERVER_PORT:18080}

# 메트릭 수집 경로는 local 프로필에서만 활성화합니다.
management:
  endpoints:
    access:
      default: none
    jmx:
      exposure:
        exclude: "*"
  prometheus:
    metrics:
      export:
        enabled: false

# 토큰 서명 키는 .env 또는 배포 환경변수에서만 가져옵니다.
app:
  auth:
    secret: ${JWT_SECRET}
    issuer: findus
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

# API 문서는 로컬 환경에서만 켭니다.
springdoc:
  # 각 API에 명시한 응답만 표시하여 관계없는 오류가 섞이지 않게 합니다.
  override-with-generic-response: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
