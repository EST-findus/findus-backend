<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>실종아동 · 로컬 DB 확인</title>
<style>
body{margin:0;padding:24px;font-family:system-ui,sans-serif;background:#f4f6f8;color:#172b3a}header,main,nav{max-width:1200px;margin:0 auto}h1{font-size:24px}p{line-height:1.6}button,a{font:inherit}button{padding:9px 12px;border:1px solid #aebec8;background:white;border-radius:4px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button[aria-current=page]{background:#172b3a;color:white}.actions,nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}#status{white-space:pre-wrap;overflow-wrap:anywhere}#people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-bottom:24px}article{padding:20px;background:white;border:1px solid #d7dfe5;border-radius:8px;min-width:0}h2{font-size:18px;margin-top:0}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}figure{margin:0;min-width:0}img{width:100%;height:180px;object-fit:contain;background:#f3f3f3}figcaption{text-align:center;font-size:14px}.empty{padding:20px;background:white}dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.6}dt{font-weight:600}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.notice{font-size:14px;color:#52616c}[hidden]{display:none!important}
</style>
</head>
<body>
<header>
<h1>실종아동 · 로컬 DB 확인</h1>
<p>자료 출처: 경찰청 · 실종아동 분류 010</p>
<p class="notice">이 화면은 우리 백엔드의 DB 조회 API를 호출합니다. HTML에 실제 데이터·사진을 저장하지 않습니다.<br>‘경찰청 동기화’만 외부 수집을 실행하며, 페이지 열기·새로고침·페이지 이동은 DB만 조회합니다.</p>
<p class="notice">MVP에서는 비회원도 동기화할 수 있습니다. 배포 전 관리자 전용으로 변경해야 합니다.</p>
<p id="file-notice" hidden>파일로 직접 열면 DB를 조회할 수 없습니다. 백엔드를 실행하고 <a href="http://localhost:18080/test/safe182">로컬 DB 확인 페이지</a>로 접속하세요.</p>
<div class="actions"><button id="sync" type="button">경찰청 동기화 → DB 저장</button><button id="reload" type="button">DB 새로고침</button></div>
<p id="status" role="status" aria-live="polite"></p>
<p id="page-status"></p>
</header>
<nav aria-label="위쪽 페이지 선택"></nav>
<main id="people" aria-busy="false"></main>
<nav aria-label="아래쪽 페이지 선택"></nav>
<noscript>DB 정보를 보려면 브라우저의 JavaScript를 켜주세요.</noscript>
<script>
'use strict';
const size = 10;
const pageGroupSize = 10;
let currentPage = 0;
let busy = false;
const status = document.getElementById('status');
const people = document.getElementById('people');
const syncButton = document.getElementById('sync');
const reloadButton = document.getElementById('reload');
function setBusy(value) {
    busy = value;
    syncButton.disabled = value;
    reloadButton.disabled = value;
    people.setAttribute('aria-busy', String(value));
    document.querySelectorAll('nav button').forEach(button => { button.disabled = value || button.dataset.unavailable === 'true'; });
}
async function api(path, method = 'GET') {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), method === 'POST' ? 600000 : 20000);
    try {
        // JWT·쿠키 없이 실행합니다. 응답을 브라우저 캐시에 저장하지 않습니다.
        const response = await fetch(path, {method, credentials:'omit', cache:'no-store', signal:controller.signal});
        const data = await response.json().catch(() => null);
        if (!response.ok) throw new Error(data?.message || `요청 실패 (HTTP ${response.status})`);
        if (!data) throw new Error('JSON 응답을 확인할 수 없습니다.');
        return data;
    } catch (error) {
        if (error.name === 'AbortError') throw new Error('응답 대기 시간이 초과됐습니다. 중복 실행하지 말고 DB 새로고침 또는 동기화 이력을 확인하세요.');
        throw error;
    } finally { clearTimeout(timeout); }
}
function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined && text !== null) node.textContent = String(text);
    if (className) node.className = className;
    return node;
}
function field(list, label, value) {
    list.append(element('dt', label), element('dd', value === null || value === undefined || value === '' ? '정보 없음' : value));
}
function card(person, index) {
    const article = element('article');
    article.append(element('h2', `${currentPage * size + index + 1}번 ${person.name}`));
    const photos = element('div', null, 'photos');
    const images = Array.isArray(person.images) ? person.images : [];
    images.forEach((image, number) => {
        // DB가 반환한 해당 아동의 백엔드 이미지 경로만 사용합니다. 외부 주소는 로딩하지 않습니다.
        const expected = `/api/missing-persons/${person.id}/images/${image.id}`;
        const figure = element('figure');
        if (image.url === expected) {
            const img = element('img');
            img.alt = `${person.name} 사진 ${number + 1}`;
            img.loading = 'lazy';
            img.src = expected;
            img.addEventListener('error', () => { img.replaceWith(element('p', '사진 조회 실패')); }, {once:true});
            figure.append(img);
        } else figure.append(element('p', '사진 주소 확인 불가'));
        figure.append(element('figcaption', `사진 ${number + 1}`));
        photos.append(figure);
    });
    article.append(images.length ? photos : element('p', '저장된 사진 없음'));
    const list = element('dl');
    for (const [label, value] of [
        ['저장된 사진', `${images.length}장`], ['경찰청 식별자', person.sourceId], ['DB UUID', person.id],
        ['분류 코드', person.category], ['성별', person.sex], ['발생일', person.occurrenceDate],
        ['당시 나이', person.age], ['현재 나이', person.ageNow], ['발생 장소', person.address],
        ['착의 사항', person.clothing], ['신체 특징', person.features], ['마지막 수집', person.lastSeenAt]
    ]) field(list, label, value);
    article.append(list);
    return article;
}
function pagination(data) {
    document.querySelectorAll('nav').forEach(nav => {
        nav.replaceChildren();
        if (data.totalPages < 2) return;
        function button(label, target, unavailable = false) {
            const node = element('button', label);
            node.type = 'button';
            node.dataset.unavailable = String(unavailable);
            node.disabled = unavailable || busy;
            if (target === currentPage && /^\d+$/.test(label)) node.setAttribute('aria-current', 'page');
            node.addEventListener('click', () => load(target, true));
            nav.append(node);
        }
        const group = Math.floor(currentPage / pageGroupSize) * pageGroupSize;
        button('처음', 0, currentPage === 0);
        button('이전', currentPage - 1, currentPage === 0);
        if (group > 0) button('이전 10쪽', group - 1);
        for (let i = group; i < Math.min(group + pageGroupSize, data.totalPages); i++) button(String(i + 1), i);
        if (group + pageGroupSize < data.totalPages) button('다음 10쪽', group + pageGroupSize);
        button('다음', currentPage + 1, currentPage >= data.totalPages - 1);
        button('마지막', data.totalPages - 1, currentPage >= data.totalPages - 1);
    });
}
async function readPage(page) {
    let data = await api(`/api/missing-persons?page=${page}&size=${size}`);
    // 동기화로 전체 페이지가 줄었다면 마지막 유효 페이지로 이동합니다.
    if (page > 0 && page >= data.totalPages) {
        page = Math.max(0, data.totalPages - 1);
        data = await api(`/api/missing-persons?page=${page}&size=${size}`);
    }
    currentPage = page;
    people.replaceChildren(...data.content.map(card));
    if (!data.totalElements) people.append(element('p', '저장된 실종아동이 없습니다. 경찰청 동기화를 실행해 주세요.', 'empty'));
    document.getElementById('page-status').textContent = data.totalElements
        ? `${page * size + 1}~${Math.min((page + 1) * size, data.totalElements)}번 / 전체 ${data.totalElements}명 · ${page + 1}/${data.totalPages}페이지`
        : '전체 0명';
    pagination(data);
}
async function load(page = currentPage, scroll = false) {
    if (busy) return;
    setBusy(true);
    status.textContent = '로컬 DB 조회 중…';
    try {
        await readPage(page);
        status.textContent = '로컬 DB 조회 완료 · 사진은 DB에 저장된 원본입니다.';
        if (scroll) window.scrollTo({top:0, behavior:'smooth'});
    } catch (error) {
        people.replaceChildren();
        document.querySelectorAll('nav').forEach(nav => nav.replaceChildren());
        document.getElementById('page-status').textContent = '';
        status.textContent = `DB 조회 실패: ${error.message}`;
    } finally { setBusy(false); }
}
syncButton.addEventListener('click', async () => {
    if (busy) return;
    setBusy(true);
    status.textContent = '경찰청 데이터·사진 수집 및 DB 저장 중… 수 분 걸릴 수 있습니다. 다시 누르지 말고 기다려 주세요.';
    try {
        const result = await api('/api/admin/missing-sync', 'POST');
        if (result.status !== 'COMPLETED') throw new Error(`동기화 상태 ${result.status}. 기존 DB는 유지됩니다.`);
        const counts = result.counts;
        const summary = `동기화 완료 · 아동 ${counts.received}명 · 수신·반영 사진 ${counts.imagesSaved}장 · 사진 확인 미완료 ${counts.photoFailures}명 · 외부 요청 ${counts.requests.total}회`;
        try {
            await readPage(0);
            status.textContent = summary + '\nDB 재조회 완료.';
        } catch (error) { status.textContent = summary + `\n저장은 완료됐지만 DB 화면 재조회 실패: ${error.message}`; }
    } catch (error) { status.textContent = `동기화 확인 실패: ${error.message}`; }
    finally { setBusy(false); }
});
reloadButton.addEventListener('click', () => load());
if (location.protocol === 'file:') {
    document.getElementById('file-notice').hidden = false;
    syncButton.disabled = true;
    reloadButton.disabled = true;
    status.textContent = '이 파일에는 실제 데이터·사진이 들어 있지 않습니다. 위의 로컬 서버 주소로 접속하세요.';
} else load(0);
</script>
</body>
</html>
